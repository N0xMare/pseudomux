[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/protocol",
  "crates/adapters",
  "crates/service",
  "apps/pmux",
  "apps/pmuxd",
  "apps/pmux-mcp",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"
rust-version = "1.85"
repository = "https://github.com/N0xMare/pseudomux"
description = "PTY multiplexer for agent TUI integration"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.dependencies]
anyhow = "1.0.102"
libc = "0.2.182"
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
tracing-appender = "0.2.4"
uuid = { version = "1.21.0", features = ["serde", "v4"] }
portable-pty = "0.9.0"
bytes = "1.11.1"
futures = "0.3.32"
clap = { version = "4.5.60", features = ["derive", "env"] }
dirs = "6.0.0"
toml = "1.0.4"
vt100 = "0.16.2"
strip-ansi-escapes = "0.2.1"
tempfile = "3.26.0"
axum = "0.8"
async-stream = "0.3"
