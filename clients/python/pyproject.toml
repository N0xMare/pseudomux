[project]
name = "pmux-client"
version = "0.1.0"
description = "Python client for the pseudomux PTY multiplexer (pmuxd HTTP API)"
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT OR Apache-2.0" }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pmux_client"]
