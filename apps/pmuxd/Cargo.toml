[package]
name = "pmuxd"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Daemon server for pseudomux PTY multiplexer (UDS + HTTP)"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["codec"] }
bytes = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
tracing-appender = { workspace = true }
pseudomux-service = { path = "../../crates/service" }
pseudomux-protocol = { path = "../../crates/protocol" }
pseudomux-adapters = { path = "../../crates/adapters" }
pseudomux-core = { path = "../../crates/core" }
libc = { workspace = true }
axum = { workspace = true }
async-stream = { workspace = true }
uuid = { workspace = true }
